<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <!-- Sign In Section -->
        <div class="form-box" id="signInBox">
            <h2>Sign In</h2>
            <form id="signInForm">
                <div class="input-field">
                    <label>Username</label>
                    <input type="text" id="loginUser" required placeholder="Enter username">
                </div>
                <div class="input-field">
                    <label>Password</label>
                    <input type="password" id="loginPass" required placeholder="Enter password">
                </div>
                <button type="submit">Sign In</button>
            </form>
            <p>Not signed up yet? <a href="#" id="showSignUp">Create an account</a></p>
        </div>

        <!-- Sign Up Section (Hidden by default) -->
        <div class="form-box hide" id="signUpBox">
            <h2>Sign Up</h2>
            <form id="signUpForm">
                <div class="input-field">
                    <label>Username</label>
                    <input type="text" id="regUser" required placeholder="Choose username">
                </div>
                <div class="input-field">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="Enter email">
                </div>
                <div class="input-field">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="Enter phone number">
                </div>
                <div class="input-field">
                    <label>Password</label>
                    <input type="password" id="regPass" required placeholder="Create password">
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" id="showSignIn">Sign In here</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
